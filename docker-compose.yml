services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ukpcb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ukpcb
      POSTGRES_PASSWORD: ukpcb
      POSTGRES_DB: ukpcb
    ports:
      # Host port 5434, not 5432 or 5433 — this machine already runs a
      # native Postgres service on 5432, and a sibling "Ask Evon" project's
      # own local Postgres container already occupies 5433; mapping around
      # both avoids touching either.
      - '5434:5432'
    volumes:
      - ukpcb-postgres-data:/var/lib/postgresql/data

volumes:
  ukpcb-postgres-data:
